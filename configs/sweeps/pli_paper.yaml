# PLI exactly as in their paper/notebook default: risk-averse 2-layer NN,
# weighted BCE (FP weight 2, FN weight 1.33), threshold 0.9, batch 64,
# 100 epochs, Adam lr 1e-3, seed 42. Compared with our saved stage 4 model.

base_config: configs/retiring_adult.yaml
train_split: algo_train
test_split: algo_test
pli:
  model_type: nn
  loss: wbce_2
  threshold: 0.9
  epochs: 100
  batch_size: 64
  lr: 0.001
  seed: 42
env_pli:
  radii: [0.0, 0.01, 0.05, 0.1, 0.2, 0.3, 0.4, 0.7, 1.0, 2.0, 4.0]
  step: 0.01
  iters: 500
  improvable_features: [AGEP, WKHP, SCHL]
