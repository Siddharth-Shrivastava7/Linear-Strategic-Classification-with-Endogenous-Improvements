# Comparison table (Ours, PLI, GSC x2, SVM) averaged over seeds, our environment.
# Every method is retrained per seed on train_split; the seed also drives the
# sampled post-response labels. Settings match the single-seed runs.

base_config: configs/law_school.yaml
train_split: algo_train
select_split: algo_val        # GSC lambda (per seed); ours: checkpoint (from base config)
test_split: algo_test
seeds: [42, 0, 1]
workers: 8

pli: {model_type: nn, loss: wbce_2, threshold: 0.9, epochs: 100, batch_size: 64, lr: 0.001}
gsc: {shifts: [l2, ours], lambdas: [0.1, 1.0], epochs: 100, batch_size: 128, lr: 0.05,
      class_weights: [null, balanced]}     # balanced = per-class weights n / (2 n_class), our addition
svm: {C: 1.0, loss: hinge, max_iter: 200000}
svm_class_weights: [null, balanced]
