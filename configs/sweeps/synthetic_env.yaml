# Environment selection for the synthetic dataset (HELOC rule): lowest expected
# improvement error on algo_val among converged cells (best epoch >= 11).
# Feasible mode, init lr + 2 restarts, 400 epochs (base config); algo_test unused.

base_config: configs/synthetic.yaml
selection_split: algo_train
report_split: algo_val
workers: 8

grid:
  clip_mode: [feasible]
  beta: [0.25, 0.5, 1, 2, 4, 8]
  alpha_profiles:                       # cost per 1 SD of (x1, x2, x3, x4, x5)
    "equal (1,1,1,1,1)":                 {x1: 1.0, x2: 1.0, x3: 1.0, x4: 1.0, x5: 1.0}
    "prop. to true w (1.5,1.2,.9,.6,.3)": {x1: 1.5, x2: 1.2, x3: 0.9, x4: 0.6, x5: 0.3}
    "x1 costly (4,1,1,1,1)":             {x1: 4.0, x2: 1.0, x3: 1.0, x4: 1.0, x5: 1.0}
    "x1,x2 fixed (1e6,1e6,1,1,1)":       {x1: 1000000.0, x2: 1000000.0, x3: 1.0, x4: 1.0, x5: 1.0}
    "strong cheap (1,2,3,4,5)":          {x1: 1.0, x2: 2.0, x3: 3.0, x4: 4.0, x5: 5.0}
    "weak cheap (5,4,3,2,1)":            {x1: 5.0, x2: 4.0, x3: 3.0, x4: 2.0, x5: 1.0}

select_by: {metric: improvement_error, split: report}
min_best_epoch: 11
min_negative_movers: 0
